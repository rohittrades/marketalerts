name: Daily Discord Alert

on:
  workflow_dispatch:
  schedule:
    # Runs at 7 am IST every day (usually auto run is delayed)
    - cron: "30 1 * * *"

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      env:
        # Mapping your GitHub Secrets to Environment Variables
        MISC_DATA: ${{ secrets.MISC_DATA }}
        DISCORD_WEBHOOK_MAIN: ${{ secrets.DISCORD_WEBHOOK_MAIN }}
        DISCORD_WEBHOOK_TMP: ${{ secrets.DISCORD_WEBHOOK_TMP }}
        GCP_BUCKET: ${{ secrets.GCP_BUCKET }}
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: python order_alerts.py