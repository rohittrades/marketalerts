name: Daily Discord Alert

on:
  workflow_dispatch:
  schedule:
    # Runs at 09:00 UTC every day (change as needed)
    - cron: "30 2 * * *"

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      env:
        # Mapping your GitHub Secrets to Environment Variables
        MISC_DATA: ${{ secrets.MISC_DATA }}
        DISCORD_WEBHOOK_MAIN: ${{ secrets.DISCORD_WEBHOOK_MAIN }}
        DISCORD_WEBHOOK_TMP: ${{ secrets.DISCORD_WEBHOOK_TMP }}
      run: python order_alerts.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/log.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update JSON data [skip ci]" && git push)