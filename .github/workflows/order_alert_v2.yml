name: Daily Orders Alert v2

on:
  workflow_dispatch:
  schedule:
    # Runs at 7 am IST every day (usually auto run is delayed)
    - cron: "30 1 * * *"

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      env:
        # Mapping your GitHub Secrets to Environment Variables
        ORDER_MISC_DATA: ${{ secrets.ORDER_MISC_DATA }}
        DISCORD_ORDER2_WEBHOOK: ${{ secrets.DISCORD_ORDER2_WEBHOOK }}
        DISCORD_WEBHOOK_TMP: ${{ secrets.DISCORD_WEBHOOK_TMP }}
        DISCORD_WEBHOOK_MISC: ${{ secrets.DISCORD_WEBHOOK_MISC }}
        GCP_BUCKET: ${{ secrets.GCP_BUCKET }}
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        OCLASSIFIER_MODEL: ${{ secrets.OCLASSIFIER_MODEL }}
        OEXTRACTOR_MODEL: ${{ secrets.OEXTRACTOR_MODEL }}
        GEMINI_PAID_KEY1: ${{ secrets.GEMINI_PAID_KEY1 }}
      run: python order_alerts_v2.py